<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="main-nav container flex">
            <a href="#" class="company-logo">
                <img src="/logo.jpg.png" alt="company logo">
            </a>
            <div class="nav-links">
                <ul class="flex">
                    <li class="hover-link nav-item">Beauty</li>
                    <li class="hover-link nav-item">IPL</li>
                    <li class="hover-link nav-item">Science</li>
                    <li class="hover-link nav-item">Technology</li>
                </ul>
            </div>
            <div class="search-bar flex">
                <input type="text" class="news-input" placeholder="eg. Science">
                <button class="search-button">Search</button>
            </div>
            <button class="dark-mode-toggle">🌙</button>
        </div>
    </nav>

    <main>
        <!-- Single container for all the cards -->
        <div class="cards-container container flex" id="cards-container">
            <!-- Cards will be dynamically inserted here -->
        </div>
    </main>

    <template id="template-news-card">
        <div class="card">
            <div class="card-header">
                <img class="image-box" src="https://via.placeholder.com/400x200" alt="400x200" id="news-img">
            </div>
            <div class="card-content">
                <h3 id="news-title">This is title</h3>
                <h6 class="news-source" id="news-source">End Gadget 26/08/2025</h6>
                <p class="news-desc" id="news-desc">Lorem ipsum dolor sit amet consectetur adipisicing elit. Atque, fugit! Laboriosam voluptatem nostrum ex consequuntur maxime omnis aut sit excepturi?</p>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>

</html>
